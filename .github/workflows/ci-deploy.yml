name: CI & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build Frontend & Validate Services
    runs-on: ubuntu-latest

    env:
      # Weather Provider Secrets (Sourced from GitHub Actions / Repository Secrets)
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      VITE_OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
      VITE_OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
      NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT || 'SkyGuardAI/1.0 (contact@skyguard.ai)' }}
      VITE_NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT || 'SkyGuardAI/1.0 (contact@skyguard.ai)' }}
      METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
      VITE_METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package*.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Validate Python Modules
        run: |
          python check_imports.py
